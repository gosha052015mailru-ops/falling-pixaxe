name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build web + sync Capacitor
        run: |
          npm ci
          npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../falling-pickaxe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: falling-pickaxe-apk
          path: falling-pickaxe.apk

      # A fixed "apk-<branch>" release, so the phone download link never changes.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" falling-pickaxe.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Falling Pickaxe APK ($GITHUB_REF_NAME)" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Открой на телефоне и скачай falling-pickaxe.apk."
