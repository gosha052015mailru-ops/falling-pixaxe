<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120a22" />
    <title>Falling Pickaxe</title>
    <link rel="icon" href="./icon.svg" />
  </head>
  <body>
    <div id="game">
      <canvas id="canvas"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="dur" id="dur"><div class="dur-ghost" id="durGhost"></div><div class="dur-fill" id="durFill"></div><span id="durText"></span></div>
          <button class="icon-btn" id="pauseBtn" aria-label="pause"></button>
        </div>
        <div class="hud-row">
          <span class="pill" id="depth"></span>
          <span class="pill" id="runCoins"></span>
          <span class="pill hidden" id="runGems"></span>
        </div>
        <div class="buffs" id="buffs"></div>
        <div class="combo" id="combo"></div>
        <div class="hud-bottom">
          <div class="nudges" id="nudges"></div>
          <button class="ff hidden" id="ffBtn" aria-label="speed"></button>
          <button class="bomb" id="bombBtn" aria-label="dynamite"><span id="bombIcon"></span><span class="count" id="bombCount">0</span></button>
        </div>
      </div>
      <div id="coach"></div>
      <div id="banner" class="banner"></div>
      <div id="screen" class="screen"></div>
      <div id="nav" class="nav hidden"></div>
      <div id="modal"></div>
      <div id="toasts"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
