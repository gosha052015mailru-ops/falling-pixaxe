<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14101c" />
    <title>Falling Pickaxe</title>
    <link rel="icon" href="./icon.svg" />
  </head>
  <body>
    <div id="game">
      <canvas id="canvas"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="dur" id="dur"><div class="dur-fill" id="durFill"></div><span id="durText"></span></div>
          <button class="icon-btn" id="pauseBtn" aria-label="pause">❚❚</button>
        </div>
        <div class="hud-row">
          <span class="pill" id="depth">0 м</span>
          <span class="pill gold" id="runCoins">🪙 0</span>
          <span class="pill pink hidden" id="runGems">💎 0</span>
        </div>
        <div class="buffs" id="buffs"></div>
        <div class="combo" id="combo"></div>
        <div class="hud-bottom">
          <div class="nudges" id="nudges"></div>
          <button class="bomb" id="bombBtn" aria-label="dynamite">💥<span id="bombCount">0</span></button>
        </div>
        <div class="hint hidden" id="hint"></div>
      </div>
      <div id="banner" class="banner"></div>
      <div id="screen" class="screen"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
